[project]
name = "foodlog-generator"
version = "0.1.0"
description = "Explainable food experience grading"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
